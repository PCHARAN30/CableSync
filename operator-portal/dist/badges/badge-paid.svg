<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 60" width="170" height="60" fill="none">
  <g transform="rotate(-3 85 30)">
    <!-- Outer stamp container -->
    <rect x="5" y="5" width="160" height="50" rx="8" fill="#15803D" fill-opacity="0.07" stroke="#15803D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner stamp border -->
    <rect x="10" y="10" width="150" height="40" rx="5" stroke="#15803D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Stamp verified check icon -->
    <g transform="translate(20, 18)">
      <circle cx="12" cy="12" r="11" fill="#15803D" fill-opacity="0.12"/>
      <path d="M7 12.2L10.5 15.5L17 8.5" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Bold stamp text -->
    <text x="54" y="37" fill="#15803D" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="22" font-weight="900" letter-spacing="3.2">PAID</text>
  </g>
</svg>
