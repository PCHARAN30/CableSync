<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 60" width="190" height="60" fill="none">
  <g transform="rotate(-3 95 30)">
    <!-- Outer stamp container -->
    <rect x="5" y="5" width="180" height="50" rx="8" fill="#C2410C" fill-opacity="0.07" stroke="#EA580C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner stamp border -->
    <rect x="10" y="10" width="170" height="40" rx="5" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Split circle partial progress icon -->
    <g transform="translate(18, 18)">
      <circle cx="12" cy="12" r="11" stroke="#EA580C" stroke-width="2.2" fill="#EA580C" fill-opacity="0.12"/>
      <path d="M12 1A11 11 0 0 1 12 23V1Z" fill="#EA580C"/>
    </g>
    
    <!-- Bold stamp text -->
    <text x="50" y="36.5" fill="#EA580C" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="19" font-weight="900" letter-spacing="2.6">PARTIAL</text>
  </g>
</svg>
