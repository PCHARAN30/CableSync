<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 60" width="170" height="60" fill="none">
  <g transform="rotate(-3 85 30)">
    <!-- Outer stamp container -->
    <rect x="5" y="5" width="160" height="50" rx="8" fill="#B91C1C" fill-opacity="0.07" stroke="#B91C1C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner stamp border -->
    <rect x="10" y="10" width="150" height="40" rx="5" stroke="#B91C1C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Stamp alert exclamation icon -->
    <g transform="translate(22, 18)">
      <circle cx="12" cy="12" r="11" fill="#B91C1C" fill-opacity="0.12"/>
      <path d="M12 7.5V13" stroke="#B91C1C" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="12" cy="16.5" r="1.3" fill="#B91C1C"/>
    </g>
    
    <!-- Bold stamp text -->
    <text x="58" y="37" fill="#B91C1C" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="22" font-weight="900" letter-spacing="3.2">DUE</text>
  </g>
</svg>
